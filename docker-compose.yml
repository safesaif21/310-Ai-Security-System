version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Maps host port 3000 to container port 80 (Nginx default)
      # 0.0.0.0 ensures it is accessible from any device on the network
      - "0.0.0.0:3000:80"
    env_file:
      - .env.docker
    restart: always
