<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Camera System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: #27ae60;
            color: white;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .detection-panel {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .detection-panel h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .detection-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        select {
            padding: 10px 15px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            min-width: 200px;
        }

        select:focus {
            outline: none;
            border-color: #3498db;
        }

        .detection-status {
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .detection-status.active {
            background: #27ae60;
            color: white;
        }

        .detection-status.inactive {
            background: #95a5a6;
            color: white;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #229954;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
        }

        .camera-info {
            color: #2c3e50;
            font-size: 14px;
            padding: 8px 15px;
            background: #ecf0f1;
            border-radius: 8px;
        }

        .camera-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .camera-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .camera-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        }

        .camera-header {
            background: #34495e;
            color: white;
            padding: 15px 20px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .camera-video {
            position: relative;
            background: #000;
            aspect-ratio: 4/3;
            overflow: hidden;
        }

        .camera-video img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .offline {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e74c3c;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
        }

        .fullscreen-btn {
            background: rgba(52, 152, 219, 0.8);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }

        .fullscreen-btn:hover {
            background: rgba(52, 152, 219, 1);
        }

        footer {
            text-align: center;
            color: white;
            padding: 20px;
            font-size: 14px;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .camera-grid {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .controls {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <span>🎥</span>
                Security Camera System
            </h1>
            <div class="status">
                <div class="status-dot"></div>
                <span id="statusText">Live</span>
            </div>
        </header>

        <div class="controls">
            <button class="btn btn-primary" onclick="refreshCameras()">🔄 Refresh Cameras</button>
            <button class="btn btn-success" onclick="toggleAllCameras()">▶️ Start All</button>
            <button class="btn btn-primary" onclick="addManualCamera()">➕ Add Camera Manually</button>
            <div class="camera-info" id="cameraCount">Loading cameras...</div>
        </div>

        <div class="detection-panel">
            <h3>🤖 YOLO Person Detection</h3>
            <div class="detection-controls">
                <select id="modelSelect" onchange="loadSelectedModel()">
                    <option value="">Select a YOLO model...</option>
                </select>
                <button class="btn btn-primary" onclick="refreshModels()">🔄 Refresh Models</button>
                <button class="btn btn-success" id="toggleDetectionBtn" onclick="toggleDetection()" disabled>
                    Enable Detection
                </button>
                <div class="detection-status inactive" id="detectionStatus">
                    Detection: OFF
                </div>
            </div>
        </div>

        <div class="camera-grid" id="cameraGrid">
            <!-- Cameras will be loaded here -->
        </div>

        <footer>
            Security Camera System | Backend: FastAPI + OpenCV + YOLO
        </footer>
    </div>

    <script>
        const BACKEND_URL = 'http://localhost:8000';
        let cameras = [];
        let camerasActive = false;
        let models = [];
        let currentModel = null;
        let detectionEnabled = false;

        window.addEventListener('load', () => {
            loadCameras();
            loadModels();
        });

        async function loadCameras() {
            try {
                const response = await fetch(`${BACKEND_URL}/cameras`);
                const data = await response.json();
                cameras = data.cameras;
                
                if (!cameras.find(c => c.id === 2)) {
                    cameras.push({
                        id: 2,
                        name: 'Camera 2',
                        url: `${BACKEND_URL}/camera/2`
                    });
                }
                
                document.getElementById('cameraCount').textContent = 
                    `${cameras.length} camera(s) detected`;
                
                renderCameras();
            } catch (error) {
                console.error('Error loading cameras:', error);
                document.getElementById('cameraCount').textContent = 
                    '⚠️ Cannot connect to backend';
                document.getElementById('statusText').textContent = 'Offline';
            }
        }

        function renderCameras() {
            const grid = document.getElementById('cameraGrid');
            grid.innerHTML = '';

            cameras.forEach(camera => {
                const card = document.createElement('div');
                card.className = 'camera-card';
                card.innerHTML = `
                    <div class="camera-header">
                        <span>📹 ${camera.name}</span>
                        <button class="fullscreen-btn" onclick="openFullscreen(${camera.id})">
                            ⛶ Fullscreen
                        </button>
                    </div>
                    <div class="camera-video" id="camera-${camera.id}">
                        <div class="loading">
                            <div class="spinner"></div>
                            <div>Connecting...</div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleAllCameras() {
            camerasActive = !camerasActive;
            const btn = event.target;

            if (camerasActive) {
                btn.textContent = '⏸️ Stop All';
                btn.classList.remove('btn-success');
                btn.classList.add('btn-danger');
                startAllCameras();
            } else {
                btn.textContent = '▶️ Start All';
                btn.classList.remove('btn-danger');
                btn.classList.add('btn-success');
                stopAllCameras();
            }
        }

        function startAllCameras() {
            cameras.forEach(camera => {
                const container = document.getElementById(`camera-${camera.id}`);
                container.innerHTML = `
                    <img src="${camera.url}" 
                         alt="${camera.name}"
                         onerror="handleImageError(${camera.id})"
                         onload="handleImageLoad(${camera.id})">
                `;
            });
        }

        function stopAllCameras() {
            cameras.forEach(camera => {
                const container = document.getElementById(`camera-${camera.id}`);
                container.innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <div>Stopped</div>
                    </div>
                `;
            });
        }

        function handleImageError(cameraId) {
            const container = document.getElementById(`camera-${cameraId}`);
            container.innerHTML = `
                <div class="offline">
                    ⚠️ Camera Offline<br>
                    <small>Check connection</small>
                </div>
            `;
        }

        function handleImageLoad(cameraId) {
            console.log(`Camera ${cameraId} connected successfully`);
        }

        function openFullscreen(cameraId) {
            const camera = cameras.find(c => c.id === cameraId);
            const win = window.open('', '_blank', 'width=1024,height=768');
            win.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>${camera.name} - Fullscreen</title>
                    <style>
                        body {
                            margin: 0;
                            background: #000;
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            height: 100vh;
                        }
                        img {
                            max-width: 100%;
                            max-height: 100%;
                            object-fit: contain;
                        }
                    </style>
                </head>
                <body>
                    <img src="${camera.url}" alt="${camera.name}">
                </body>
                </html>
            `);
        }

        function refreshCameras() {
            document.getElementById('cameraCount').textContent = 'Refreshing...';
            camerasActive = false;
            loadCameras();
        }

        function addManualCamera() {
            const cameraId = prompt('Enter camera ID (e.g., 2 for Camera 2):');
            if (cameraId !== null && cameraId !== '') {
                const id = parseInt(cameraId);
                
                if (cameras.find(c => c.id === id)) {
                    alert('Camera already in list!');
                    return;
                }
                
                cameras.push({
                    id: id,
                    name: `Camera ${id}`,
                    url: `${BACKEND_URL}/camera/${id}`
                });
                
                document.getElementById('cameraCount').textContent = 
                    `${cameras.length} camera(s) detected`;
                
                renderCameras();
                
                if (camerasActive) {
                    setTimeout(() => startAllCameras(), 100);
                }
            }
        }

        async function loadModels() {
            try {
                const response = await fetch(`${BACKEND_URL}/models`);
                const data = await response.json();
                models = data.models;
                currentModel = data.current_model;
                detectionEnabled = data.detection_enabled;

                const select = document.getElementById('modelSelect');
                select.innerHTML = '<option value="">Select a YOLO model...</option>';

                models.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model.name;
                    option.textContent = `${model.name} (${model.size_mb} MB)`;
                    if (model.name === currentModel) {
                        option.selected = true;
                    }
                    select.appendChild(option);
                });

                updateDetectionUI();

                if (models.length === 0) {
                    console.log('No YOLO models found in the "models" folder.');
                }
            } catch (error) {
                console.error('Error loading models:', error);
            }
        }

        async function loadSelectedModel() {
            const select = document.getElementById('modelSelect');
            const modelName = select.value;

            if (!modelName) return;

            try {
                const response = await fetch(`${BACKEND_URL}/model/load?model_name=${modelName}`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    currentModel = modelName;
                    detectionEnabled = true;
                    updateDetectionUI();
                    alert(`✅ Model loaded: ${modelName}\nDetection enabled!`);
                } else {
                    alert(`❌ Error: ${data.message}`);
                }
            } catch (error) {
                console.error('Error loading model:', error);
                alert('Failed to load model. Check console for details.');
            }
        }

        async function toggleDetection() {
            if (!currentModel) {
                alert('Please select and load a model first!');
                return;
            }

            try {
                const newState = !detectionEnabled;
                const response = await fetch(`${BACKEND_URL}/detection/toggle?enabled=${newState}`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    detectionEnabled = newState;
                    updateDetectionUI();
                } else {
                    alert(`Error: ${data.message}`);
                }
            } catch (error) {
                console.error('Error toggling detection:', error);
            }
        }

        function updateDetectionUI() {
            const toggleBtn = document.getElementById('toggleDetectionBtn');
            const statusDiv = document.getElementById('detectionStatus');

            if (currentModel) {
                toggleBtn.disabled = false;
                
                if (detectionEnabled) {
                    toggleBtn.textContent = 'Disable Detection';
                    toggleBtn.className = 'btn btn-danger';
                    statusDiv.textContent = 'Detection: ON';
                    statusDiv.className = 'detection-status active';
                } else {
                    toggleBtn.textContent = 'Enable Detection';
                    toggleBtn.className = 'btn btn-success';
                    statusDiv.textContent = 'Detection: OFF';
                    statusDiv.className = 'detection-status inactive';
                }
            } else {
                toggleBtn.disabled = true;
                toggleBtn.textContent = 'Enable Detection';
                toggleBtn.className = 'btn btn-success';
                statusDiv.textContent = 'Detection: OFF';
                statusDiv.className = 'detection-status inactive';
            }
        }

        function refreshModels() {
            loadModels();
        }
    </script>
</body>
</html>
